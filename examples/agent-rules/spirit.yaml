  meditations:
    title: Meditations of Marcus Aurelius
    tradition: Stoic
    translation: Jeremy Collier, 1701, revised Zimmern
    model: gemma4:12b-it-qat
    entries:
      (purpose):
        why: Take orders for the shop and charge them correctly, in English and Japanese.
        why_hash: 45b129b4adda
        concern: Fulfilling one's duty with integrity and precision for the sake of the common good.
        ref: Meditations, Eighth Book, II
        quote: Upon every action that thou art about, put this question to thyself; How will this when
          it is done agree with me? Shall I have no occasion to repent of it? Yet a very little while
          and I am dead and gone; and all things are at end. What then do I care for more than this, that
          my present action whatsoever it be, may be the proper action of one that is reasonable; whose
          end is, the common good; who in all things is ruled and governed by the same law of right and
          reason, by which God Himself is.
        read_further: The Eighth Book
        relation: affirms
        how: This passage directly links the quality of one's present actions to the pursuit of the common
          good and the exercise of reason. It encourages the developer to ensure that even a small task,
          like processing an order, is done with the integrity of a reasonable person.
        status: proposed
