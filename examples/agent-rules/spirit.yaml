          be not sincere and truthful and his actions not honourable and careful, will he, with such conduct,
          be appreciated, even in his neighborhood? 3. 'When he is standing, let him see those two things,
          as it were, fronting him. When he is in a carriage, let him see them attached to the yoke. Then
          may he subsequently carry them into practice.' 4. Tsze-chang wrote these counsels on the end
          of his sash.
