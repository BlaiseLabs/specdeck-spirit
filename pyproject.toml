[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specdeck-spirit"
version = "0.1.0"
description = "A fork of specdeck that reads the why of each rule in your spec next to a spiritual text you choose, with open models running locally."
requires-python = ">=3.10"
dependencies = [
    "pytest>=7",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]
index = ["numpy"]    # `specdeck spirit index`: optional, searches work without it

[project.scripts]
specdeck = "specdeck.cli:main"

[project.entry-points.pytest11]
specdeck = "specdeck.plugin"

[tool.setuptools.packages.find]
include = ["specdeck*"]

[tool.setuptools.package-data]
specdeck = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
specdeck_feature = "specdeck"
specdeck_description = "The spec generator, specified by its own tests."
# specdeck gates itself: an unmet requirement, an unknown covers= id, or an
# invalid generated spec fails the run.
specdeck_fail_on_unmet = "true"
specdeck_fail_on_unknown_covers = "true"
specdeck_fail_on_invalid = "true"

[tool.proofdeck]
exclude = ["bench/*"]   # the agent A/B experiment: scripts, not library code
